[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-fmri"
version = "0.1.0"
description = "Cross-narrative fMRI encoding analyses with low-dimensional GPT-2 features"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
